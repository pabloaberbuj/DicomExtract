# DicomExtract / DicomExport.Core — config.ini (CLAVE=valor; '#' comenta; sin secciones)

# Daemon DICOM (ARIA)
AE_ARIA=VMSDBD1
IP_DAEMON=10.0.1.71
PORT_DAEMON=10002

# AE al que el daemon envía los objetos = File Service VMSFD de 10.0.1.71
AE_DESTINO=VMSFD

# Carpeta donde VMSFD escribe los .dcm. Desde OTRA PC debe ser la ruta UNC compartida
# (permisos de lectura, escritura y borrado). En 10.0.1.71 mismo puede ser local (C:\temp\FileService\VMSFD\).
VMSFD_PATH=\\Eclipse-vm\VMSFD

# Carpeta raíz donde se crean las sesiones de salida
ROOT_EXPORT_PATH=C:\temp\FileService\

# Identidad de este equipo ante el daemon (solo SCU). Debe estar autorizada si el daemon valida el AE llamante.
# Este archivo es compartido por todas las PCs: para valores propios de cada PC (AE_LOCAL, IP_LOCAL,
# ROOT_EXPORT_PATH...) crear %LOCALAPPDATA%\DicomExtract\config.local.ini; sus claves pisan las de acá.
AE_LOCAL=EVIL_SCU
IP_LOCAL=127.0.0.1

# LEGACY próstata (apagado por defecto). Con true se habilita en la UI la extracción de métricas DVH / constraints /
# normalización D95 (CSV metricas_planes_*.csv). En el proyecto site-agnostic Python recalcula todo eso desde la
# RTDOSE cruda, por eso queda inactivo. Reactivar = poner true y reiniciar la app.
EXTRAER_METRICAS_DVH=false

# Espera máxima (s) por el turno de exportación cuando otro usuario está exportando
LOCK_TIMEOUT_SEG=600
